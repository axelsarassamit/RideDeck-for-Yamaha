name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Check compiled app text encoding
        run: python3 scripts/check_text_encoding.py --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: app/build/outputs/apk/debug/*.apk
