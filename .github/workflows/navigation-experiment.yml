name: Navigation renderer experiment
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/premium-navigation-renderer
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Kotlin tests and compile Android debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-experiment-debug-apk
          path: app/build/outputs/apk/debug/*.apk
